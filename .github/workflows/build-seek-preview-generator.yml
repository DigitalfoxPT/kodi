name: Build Windows Seek Preview Generator

on:
  push:
    branches:
      - android-tv-seek-preview
    paths:
      - "tools/windows/KodiSeekPreviewGenerator/**"
      - ".github/workflows/build-seek-preview-generator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seek-preview-generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: WinUI 3 x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Validate BIF writer
        run: >-
          dotnet run
          --project tools/windows/KodiSeekPreviewGenerator/tests/KodiSeekPreviewGenerator.Core.SmokeTests/KodiSeekPreviewGenerator.Core.SmokeTests.csproj
          --configuration Release

      - name: Publish unpackaged self-contained WinUI 3 app
        run: >-
          dotnet publish
          tools/windows/KodiSeekPreviewGenerator/src/KodiSeekPreviewGenerator.App/KodiSeekPreviewGenerator.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --property Platform=x64
          --output "${{ runner.temp }}/KodiSeekPreviewGenerator"

      - name: Verify published application starts
        shell: pwsh
        run: |
          $application = Join-Path `
            $env:RUNNER_TEMP `
            "KodiSeekPreviewGenerator/KodiSeekPreviewGenerator.App.exe"
          $failures = @()
          foreach ($probe in @(
            "empty", "grid", "text", "stack", "textbox", "button",
            "progress", "list", "full")) {
            if ($probe -eq "full") {
              Remove-Item Env:KODI_SEEK_PREVIEW_UI_PROBE -ErrorAction SilentlyContinue
            } else {
              $env:KODI_SEEK_PREVIEW_UI_PROBE = $probe
            }
            $process = Start-Process -FilePath $application -PassThru
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) {
              Write-Host "FAILED probe: $probe (exit $($process.ExitCode))"
              $failures += $probe
              continue
            }
            if ($process.MainWindowHandle -eq 0) {
              Write-Host "FAILED probe: $probe (no main window)"
              $failures += $probe
            } else {
              Write-Host "PASSED probe: $probe ($($process.MainWindowTitle))"
            }
            Stop-Process -Id $process.Id -Force
          }
          if ($failures.Count -gt 0) {
            $diagnostic = Join-Path `
              $env:LOCALAPPDATA `
              "KodiSeekPreviewGenerator/startup-trace.log"
            if (Test-Path -LiteralPath $diagnostic) {
              Get-Content -LiteralPath $diagnostic
            }
            throw "UI startup probes failed: $($failures -join ', ')"
          }

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials"
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $ffmpeg = Get-ChildItem -LiteralPath $expanded -Filter "ffmpeg.exe" -Recurse |
            Select-Object -First 1
          if ($null -eq $ffmpeg) {
            throw "ffmpeg.exe was not found in the downloaded archive"
          }
          Copy-Item -LiteralPath $ffmpeg.FullName `
            -Destination "${{ runner.temp }}/KodiSeekPreviewGenerator/ffmpeg.exe"

      - name: Upload Windows application
        uses: actions/upload-artifact@v6
        with:
          name: kodi-seek-preview-generator-win-x64
          path: ${{ runner.temp }}/KodiSeekPreviewGenerator
          if-no-files-found: error
          retention-days: 30
