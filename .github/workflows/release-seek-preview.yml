name: Release Android TV and Windows generator

on:
  push:
    branches: [android-tv-seek-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-seek-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/android-tv-seek-preview'
    uses: ./.github/workflows/build-android-tv.yml
    secrets: inherit

  windows:
    if: github.ref == 'refs/heads/android-tv-seek-preview'
    uses: ./.github/workflows/build-seek-preview-generator.yml

  publish:
    needs: [android, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: seek-preview-2026.10.10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download Android APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: kodi-21.3-android-tv-armv7-seek-preview
          path: release/android

      - name: Download Windows application
        uses: actions/download-artifact@v8.0.2
        with:
          name: kodi-seek-preview-generator-win-x64
          path: release/windows/KodiSeekPreviewGenerator

      - name: Package and checksum release files
        run: |
          set -euo pipefail
          mkdir -p release/assets
          test -s release/android/kodiapp-armeabi-v7a-release.apk
          test -s release/windows/KodiSeekPreviewGenerator/Kodi.exe
          test -s release/windows/KodiSeekPreviewGenerator/Data/KodiSeekPreviewGenerator.App.exe
          test -s release/windows/KodiSeekPreviewGenerator/Data/ffmpeg.exe
          cp release/android/kodiapp-armeabi-v7a-release.apk release/assets/
          (cd release/windows && zip -qr ../assets/KodiSeekPreviewGenerator-win-x64.zip KodiSeekPreviewGenerator)
          (cd release/assets && sha256sum *.apk *.zip > SHA256SUMS.txt)

      - name: Publish both applications together
        run: |
          set -euo pipefail
          # A draft is published only after both verified builds are attached.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            test "$TAG_SHA" = "$GITHUB_SHA" || { echo 'Release tag points at a different commit'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title "Kodi 21.3 Seek Preview - 2026.10.10" \
              --notes-file docs/SEEK-PREVIEW-RELEASE.md
          fi
          gh release upload "$RELEASE_TAG" release/assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
