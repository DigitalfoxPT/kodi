name: Build Android TV APK

on:
  push:
    branches:
      - android-tv-seek-preview
    paths:
      - "xbmc/**"
      - "addons/skin.estuary/**"
      - ".github/workflows/build-android-tv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-armv7:
    name: Kodi 21.3 Android TV ARMv7
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KODI_DEPENDS: ${{ github.workspace }}/.android-tools/xbmc-depends
      KODI_TARBALLS: ${{ github.workspace }}/.android-tools/xbmc-tarballs
      KODI_BUILD: ${{ github.workspace }}/.android-tools/kodi-build
      ANDROID_NDK_VERSION: 21.4.7075529

    steps:
      - name: Checkout Android TV branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev \
            ninja-build unzip zip zlib1g-dev

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;33.0.1" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Cache downloaded dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ env.KODI_TARBALLS }}
          key: kodi-21.3-android-tarballs-${{ runner.os }}-${{ hashFiles('tools/depends/target/**') }}
          restore-keys: |
            kodi-21.3-android-tarballs-${{ runner.os }}-

      - name: Configure Android ARMv7 dependencies
        working-directory: tools/depends
        run: |
          ./bootstrap
          ./configure \
            --with-tarballs="${KODI_TARBALLS}" \
            --host=arm-linux-androideabi \
            --with-sdk-path="${ANDROID_HOME}" \
            --with-ndk-path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            --with-ndk-api=30 \
            --prefix="${KODI_DEPENDS}" \
            --enable-debug=no

      - name: Build Android dependencies
        working-directory: tools/depends
        run: |
          # Several vendored generators use the words "error" and "warning" for
          # non-fatal diagnostics. GitHub problem matchers otherwise present them
          # as failed annotations even though the dependency build succeeds.
          # Keep the complete messages in the log while reporting a real make
          # failure as one accurate annotation.
          set -o pipefail
          if ! make -j2 2>&1 | sed -E \
            -e 's/(^|[[:space:]])warning:/\1dependency-warning:/g' \
            -e 's/(^|[[:space:]])error:/\1dependency-error:/g'; then
            echo "::error::Android dependency build failed; inspect this step's log"
            exit 1
          fi

      - name: Restore persistent APK signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is required"
            exit 1
          fi
          mkdir -p "${HOME}/.android"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${HOME}/.android/debug.keystore"
          chmod 600 "${HOME}/.android/debug.keystore"
          keytool -list \
            -keystore "${HOME}/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Configure Kodi
        run: |
          mkdir -p "${KODI_BUILD}"
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="${KODI_BUILD}"

      - name: Build Kodi
        run: |
          # Kodi builds the bundled libdvdcss, libdvdread and libdvdnav sources
          # here. Their old Autoconf macros emit non-fatal diagnostics that the
          # runner mistakes for warnings in this repository. Preserve those
          # diagnostics in the log without creating misleading annotations.
          set -o pipefail
          if ! cmake --build "${KODI_BUILD}" --parallel 2 2>&1 | sed -E \
            -e 's/(^|[[:space:]])warning:/\1dependency-warning:/g' \
            -e 's/(^|[[:space:]])error:/\1dependency-error:/g'; then
            echo "::error::Kodi build failed; inspect this step's log"
            exit 1
          fi

      - name: Package APK
        run: cmake --build "${KODI_BUILD}" --target apk --parallel 2

      - name: Collect APK
        run: |
          APK_SOURCE="$(find "${GITHUB_WORKSPACE}" -type f -name "kodiapp-armeabi-v7a-release.apk" -print -quit)"
          if [ -z "${APK_SOURCE}" ]; then
            echo "::error::kodiapp-armeabi-v7a-release.apk was not generated"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/apk"
          cp "${APK_SOURCE}" "${RUNNER_TEMP}/apk/kodiapp-armeabi-v7a-release.apk"

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v6
        with:
          name: kodi-21.3-android-tv-armv7-seek-preview
          path: ${{ runner.temp }}/apk/kodiapp-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
